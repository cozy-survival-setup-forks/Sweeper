# Sweeper - lang.yml
# Every message can be sent as chat, action bar or both, with an optional sound.
# Text supports MiniMessage as well as &a and &#RRGGBB codes.

warning:
  # Placeholders: <time>
  enabled: true
  type: [chat, actionbar]
  chat: "<bold><#C8B4FF>SWEEPER</#C8B4FF></bold> <#A7B6C4>⏵</#A7B6C4> <white>Dropped entities are clearing in <#FFD166><time></#FFD166>."
  actionbar: "<bold><#C8B4FF>SWEEPER</#C8B4FF></bold> <#A7B6C4>⏵</#A7B6C4> <white>Dropped entities are clearing in <#FFD166><time></#FFD166>."
  sound:
    enabled: true
    key: "minecraft:block.note_block.pling"
    source: MASTER
    volume: 1.0
    pitch: 1.2

complete:
  # Placeholders: <total>, <items>, <entities>
  enabled: true
  type: [chat, actionbar]
  chat: "<bold><#C8B4FF>SWEEPER</#C8B4FF></bold> <#A7B6C4>⏵</#A7B6C4> <#8BF0A6><total></#8BF0A6> <white>dropped entities have been removed!"
  actionbar: "<bold><#C8B4FF>SWEEPER</#C8B4FF></bold> <#A7B6C4>⏵</#A7B6C4> <#8BF0A6><total></#8BF0A6> <white>dropped entities have been removed!"
  sound:
    enabled: true
    key: "minecraft:entity.experience_orb.pickup"
    source: MASTER
    volume: 1.0
    pitch: 1.0

